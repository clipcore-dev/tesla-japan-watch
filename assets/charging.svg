<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" role="img" aria-labelledby="title desc"><title id="title">モバイルコネクターの理論入力電力比較</title><desc id="desc">100V 12Aは1.2kW、200V 16Aは3.2kW。電圧と電流から計算した理論値で、実際の充電量ではありません。</desc><rect width="820" height="330" fill="#eeeee7"/><g font-family="sans-serif" fill="#202523"><text x="40" y="46" font-size="21" font-weight="bold">自宅充電の理論入力電力</text><text x="40" y="78" font-size="13">電圧 × 電流 ÷ 1,000 ／ 実測値ではありません</text><text x="40" y="138" font-size="16">100V · 12A</text><rect x="205" y="110" width="180" height="40" rx="3" fill="#78877c"/><text x="401" y="137" font-size="19">1.2 kW</text><text x="40" y="210" font-size="16">200V · 16A</text><rect x="205" y="182" width="480" height="40" rx="3" fill="#c63b32"/><text x="702" y="209" font-size="19">3.2 kW</text><text x="40" y="278" font-size="12">充電損失・気温・車両側の制限により、実際の充電電力は異なります。</text><text x="40" y="303" font-size="11">出典：Tesla日本公式 モバイルコネクターの電流仕様 ／ 図：編集部</text></g></svg>
